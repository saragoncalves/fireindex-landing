<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FireIndex — informação para proteger o território." />
    <title>FireIndex</title>
    <style>
      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #183c32;
        background: #f4f7f5;
        font-family: Arial, sans-serif;
      }

      main {
        width: min(680px, 100%);
        text-align: center;
      }

      .logo {
        margin-bottom: 40px;
        font-size: 24px;
        font-weight: 800;
      }

      .logo span { color: #e7623e; }

      h1 {
        margin: 0 0 20px;
        color: #17211e;
        font-size: clamp(42px, 8vw, 72px);
        line-height: 1.05;
      }

      p {
        margin: 0 auto 32px;
        max-width: 560px;
        color: #5d6b66;
        font-size: 19px;
        line-height: 1.6;
      }

      a {
        display: inline-block;
        padding: 14px 24px;
        border-radius: 6px;
        color: white;
        background: #e7623e;
        font-weight: 700;
        text-decoration: none;
      }

      a:hover { background: #bd3c27; }
      a:focus-visible { outline: 3px solid #183c32; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">Fire<span>Index</span></div>
      <h1>Protegemos o território.</h1>
      <p>Informação meteorológica simples e clara para apoiar decisões mais rápidas e seguras.</p>
      <a href="mailto:geral@fireindex.pt">Falar connosco</a>
    </main>
  </body>
</html>
